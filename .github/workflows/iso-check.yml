name: Isolation check

# Scratch workflow (fork only): do the tests that failed under nextest on #2933 also fail on
# upstream main under cargo test (shared process), and alone?

on:
  push:
    branches: [ci-isolation-check]

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build
        run: cargo test -p photocraft-ui-egui --no-run --lib --test arbitrary_rotation_preview

      - name: "cargo test, whole lib binary (shared process): type_tool"
        if: always()
        run: cargo test -p photocraft-ui-egui --lib -- type_tool::canvas_tests 2>&1 | grep -E 'postscript_only_style|test result' || true
      - name: "cargo test, alone: postscript_only_style"
        if: always()
        run: cargo test -p photocraft-ui-egui --lib -- --exact type_tool::canvas_tests::postscript_only_style_shows_actual_subfamily 2>&1 | grep -E 'postscript_only_style|test result|left|right' || true
      - name: "nextest: postscript_only_style"
        if: always()
        run: cargo nextest run -p photocraft-ui-egui --lib -E 'test(postscript_only_style_shows_actual_subfamily)' --no-fail-fast 2>&1 | grep -E 'PASS|FAIL|left|right|Summary' || true

      - name: "cargo test, whole binary: arbitrary_rotation_preview"
        if: always() && runner.os == 'Linux'
        run: cargo test -p photocraft-ui-egui --test arbitrary_rotation_preview 2>&1 | grep -E '^test |test result|preview moved' || true
      - name: "cargo test, alone x3: size_changing_rotation_preview"
        if: always() && runner.os == 'Linux'
        run: |
          for i in 1 2 3; do
            cargo test -p photocraft-ui-egui --test arbitrary_rotation_preview -- --exact size_changing_rotation_preview_is_visible_and_preserves_the_panned_center 2>&1 | grep -E 'test result|preview moved' || true
          done
      - name: "nextest x3: size_changing_rotation_preview"
        if: always() && runner.os == 'Linux'
        run: |
          for i in 1 2 3; do
            cargo nextest run -p photocraft-ui-egui --test arbitrary_rotation_preview -E 'test(size_changing_rotation_preview)' 2>&1 | grep -E 'PASS|FAIL|preview moved' || true
          done
