name: Perf (nightly)

# The performance scorecard (#221): `cargo xtask perf` on fixed GitHub-hosted runners, one per
# OS (macOS on Apple silicon with Metal, Linux and Windows on their standard x86-64 images),
# every night and on demand. It never runs on pull requests, so it can't block one.
# Each runner is its own machine class. A run fails when an enforced budget in
# perf/budgets.toml breaks, or when a scenario's p50 regresses more than 15 % against a
# baseline from the same machine class (other classes are never compared). The table goes to
# the job summary; results.json is uploaded as an artifact.
#
# To (re)record a class's baseline: run it by hand with "update_baseline", download that
# runner's `perf-baseline-<os>` artifact and commit it under perf/baselines/ in a PR.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      quick:
        description: "Quick subset (small documents, no budgets)"
        type: boolean
        default: false
      update_baseline:
        description: "Also write perf/baseline.json from this run (uploaded as an artifact, not committed)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: perf-nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  perf:
    name: perf (${{ matrix.label }})
    # Pinned images, not -latest: the machine class must stay fixed for comparisons.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15
            label: macOS, Apple GPU
          - os: linux
            runner: ubuntu-24.04
            label: Linux, x86-64
          - os: windows
            runner: windows-2022
            label: Windows, x86-64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux system dependencies (egui/winit)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: perf-release-${{ matrix.os }}

      - name: Run benchmarks
        id: perf
        env:
          QUICK: ${{ inputs.quick }}
          UPDATE: ${{ inputs.update_baseline }}
        shell: bash
        run: |
          args=()
          if [ "$QUICK" = "true" ]; then args+=(--quick); fi
          if [ "$UPDATE" = "true" ]; then args+=(--update-baseline); fi
          cargo xtask perf "${args[@]}"

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f target/perf/summary.md ]; then
            cat target/perf/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No perf summary: the run failed before writing one (see the log)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ matrix.os }}
          path: |
            target/perf/*.json
            target/perf/summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload baseline
        if: always() && inputs.update_baseline
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline-${{ matrix.os }}
          path: perf/baseline.json
          if-no-files-found: warn
          retention-days: 30
