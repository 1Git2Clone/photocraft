name: Windows CI experiment

# Scratch workflow (fork only): times variants of ci.yml's Windows test job side by side.

on:
  workflow_dispatch:
  push:
    branches: [ci-windows-exp]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    name: win (${{ matrix.v }} ${{ matrix.rep }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        v: [su, si1, si2]
        rep: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - name: Probe runner
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled | Format-List
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
          "cores: $env:NUMBER_OF_PROCESSORS"
          $cpu = (Get-CimInstance Win32_Processor).Name
          Write-Output "CPU=$cpu"

      - uses: actions/checkout@v4

      - name: Dev Drive
        if: matrix.v == 'devdrive' || matrix.v == 'all'
        uses: samypr100/setup-dev-drive@v3
        with:
          drive-size: 60GB
          workspace-copy: true
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup

      - name: No debuginfo
        if: matrix.v != 'base'
        run: echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"

      - name: Pick workspace
        run: |
          ws="${DEV_DRIVE_WORKSPACE:-$GITHUB_WORKSPACE}"
          echo "WS=$ws" >> "$GITHUB_ENV"
          echo "workspace: $ws"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: exp-nodebug
          workspaces: ${{ env.WS }} -> target
          cache-on-failure: true

      - name: opt-level 0 for ui-egui only (after the cache step)
        if: matrix.v != 'base'
        run: printf '[profile.dev.package.photocraft-ui-egui]\nopt-level = 0\n' >> .cargo/config.toml

      - name: sccache
        if: matrix.v == 'su' || matrix.v == 'si1' || matrix.v == 'si2'
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Use sccache (after the cache step)
        if: matrix.v == 'su' || matrix.v == 'si1' || matrix.v == 'si2'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: rust-lld linker
        if: matrix.v == 'lld' || matrix.v == 'all' || matrix.v == 'nlld' || matrix.v == 'ndl'
        working-directory: ${{ env.WS }}
        run: printf '[target.x86_64-pc-windows-msvc]\nlinker = "rust-lld"\n' >> .cargo/config.toml

      - name: Install nextest
        if: matrix.v == 'nextest' || matrix.v == 'all' || matrix.v == 'nodebug' || matrix.v == 'nlld' || matrix.v == 'ndl' || matrix.v == 'uio0' || matrix.v == 'unit' || matrix.v == 'integ' || matrix.v == 'uA' || matrix.v == 'uB' || matrix.v == 'su' || matrix.v == 'si1' || matrix.v == 'si2' || matrix.v == 'iA' || matrix.v == 'iB'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build
        working-directory: ${{ env.WS }}
        run: |
          sel=()
          if [ "${{ matrix.v }}" != base ] && [ "${{ matrix.v }}" != lld ] && [ "${{ matrix.v }}" != devdrive ]; then sel=(--lib --bins --tests); fi
          case "${{ matrix.v }}" in
            unit|su) sel=(--lib --bins) ;;
            integ|si1|si2) sel=(--test '*') ;;
            uA) sel=(--exclude photocraft-engine --lib --bins) ;;
            uB) sel=(--lib) ;;
            iA) sel=(--exclude photocraft-ui-egui --exclude photocraft-gpu --test '*') ;;
            iB) sel=(--test '*') ;;
          esac
          pkg=(--workspace); if [ "${{ matrix.v }}" = uB ]; then pkg=(-p photocraft-engine); fi
          if [ "${{ matrix.v }}" = iB ]; then pkg=(-p photocraft-ui-egui -p photocraft-gpu); fi
          feat=(--features heif); if [ "${{ matrix.v }}" = uB ] || [ "${{ matrix.v }}" = iB ]; then feat=(); fi
          cargo test "${pkg[@]}" --locked "${feat[@]}" "${sel[@]}" --no-run --timings

      - name: Run tests
        working-directory: ${{ env.WS }}
        run: |
          case "${{ matrix.v }}" in
            base|lld|devdrive) cargo test --workspace --locked --features heif ;;
            noex) cargo test --workspace --locked --features heif --lib --bins --tests ;;
            unit|su) cargo nextest run --workspace --locked --features heif --lib --bins --no-fail-fast ;;
            integ) cargo nextest run --workspace --locked --features heif --test '*' --no-fail-fast ;;
            si1) cargo nextest run --workspace --locked --features heif --test '*' --no-fail-fast --partition count:1/2 ;;
            si2) cargo nextest run --workspace --locked --features heif --test '*' --no-fail-fast --partition count:2/2 ;;
            uA) cargo nextest run --workspace --exclude photocraft-engine --locked --features heif --lib --bins --no-fail-fast ;;
            uB) cargo nextest run -p photocraft-engine --locked --lib --no-fail-fast ;;
            iA) cargo nextest run --workspace --exclude photocraft-ui-egui --exclude photocraft-gpu --locked --features heif --test '*' --no-fail-fast ;;
            iB) cargo nextest run -p photocraft-ui-egui -p photocraft-gpu --locked --test '*' --no-fail-fast ;;
            nextest|all|nodebug|nlld|ndl|uio0) cargo nextest run --workspace --locked --features heif --lib --bins --tests --no-fail-fast ;;
          esac

      - name: Doc tests
        if: matrix.v != 'base' && matrix.v != 'lld' && matrix.v != 'devdrive' && matrix.v != 'integ' && matrix.v != 'si1' && matrix.v != 'si2' && matrix.v != 'uB' && matrix.v != 'iA' && matrix.v != 'iB'
        working-directory: ${{ env.WS }}
        run: cargo test --workspace --locked --features heif --doc

      - name: sccache stats
        if: always() && (matrix.v == 'su' || matrix.v == 'si1' || matrix.v == 'si2')
        run: sccache --show-stats

      - name: Clippy
        if: matrix.v == 'si2'
        working-directory: ${{ env.WS }}
        run: cargo clippy --workspace --all-targets --locked --features heif -- -D warnings

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timings-${{ matrix.v }}-${{ matrix.rep }}
          path: ${{ env.WS }}/target/cargo-timings/cargo-timing.html
          if-no-files-found: warn

