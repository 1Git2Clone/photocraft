id: args-os
language: rust
severity: error
message: std::env::args() panics on an argument that isn't valid Unicode
note: |
  Read std::env::args_os() and let clap parse the OsStrings, so a Latin-1 file name reaches the
  command (or is a usage error) instead of aborting before anything is printed (#1108).
rule:
  any:
    - pattern: std::env::args()
    - pattern: env::args()
